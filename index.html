<meta charset="utf-8" />

<title>名城嘉苑入住统计</title>
<style>
  :root {
    --bg: #f6f5f2;
    --ink: #1c1b19;
    --muted: #5e5a54;
    --line: #e2ddd4;
    --card: #fff;
    --green: #1f8a65;
    --orange: #c56a1a;
    --blue: #2e79b5;
    --yellow: #e3b423;
    --shaft: #eceae4;
    --focus: #1c1b19;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 22px 0 6px; }
  p { margin: 0; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 16px 0; }
  .stat b { display: block; font-size: 22px; color: var(--ink); font-weight: 650; }
  .stat span { font-size: 12px; color: var(--muted); }
  .legend, .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .legend i { width: 12px; height: 12px; display: inline-block; border: 1px solid rgba(0,0,0,.12); vertical-align: -1px; margin-right: 4px; }
  .pill { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; gap: 4px; margin-top: 8px; }
  .grid button, .slot, .fl { min-height: 40px; border-radius: 2px; }
  .slot, .fl { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .grid button { border: 1px solid rgba(0,0,0,.08); font: 11px/1.2 inherit; cursor: pointer; padding: 4px 2px; }
  .grid button.on { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sold-in { background: var(--green); color: #fff; }
  .sold-out { background: var(--orange); color: #fff; }
  .open-in { background: var(--blue); color: #fff; }
  .open-out { background: var(--yellow); color: #1c1b19; }
  .shaft, .muted { background: var(--shaft); color: #6d6962; }
  .detail { margin-top: 12px; }
  .detail strong { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 14px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 550; }
  tr:nth-child(even) td { background: #faf9f6; }
  button.link { background: none; border: none; padding: 0; color: #1d5f99; cursor: pointer; font: inherit; }
  .note { margin-top: 14px; font-size: 13px; }
</style>
</head>

    [totals.open, "未售"],
    [GROUP, "已入群（人）"],
    [totals.people, "备注有正确门牌（人，" + totals.grouped + "户）"],
    [totals.unmatched, "未入群或门牌未对上（户）"]
  ];
  document.getElementById("stats").innerHTML = stats.map(([v, l]) => "<div class='stat'><b>" + v + "</b><span>" + l + "</span></div>").join("");
  const legend = [
    ["sold-in", "已售，门牌已对上"],
    ["sold-out", "已售，门牌未对上"],
    ["open-in", "未售，门牌已对上"],
    ["open-out", "未售，门牌未对上"],
    ["shaft", "风井 / 架空 / 消防"]
  ];
  document.getElementById("legend").innerHTML = legend.map(([c, t]) => "<span><i class='" + c + "'></i>" + t + "</span>").join("");
  document.getElementById("buildings").innerHTML = DATA.buildings.map(b => "<button class='pill" + (String(b.no) === current ? " on" : "") + "' data-b='" + b.no + "'>" + b.no + "号楼</button>").join("");
  const filters = [["all", "全部"], ["gap", "只看未对上门牌"], ["open", "只看未售"]];
  document.getElementById("filters").innerHTML = filters.map(([id, t]) => "<button class='pill" + (filter === id ? " on" : "") + "' data-f='" + id + "'>" + t + "</button>").join("");
  document.getElementById("title").textContent = building.no + "号楼";
  document.getElementById("sub").textContent = "住宅 " + s.homes + " 套，已售 " + s.sold + "，未售 " + s.open + "。门牌已对上 " + s.grouped + " 户（" + s.people + " 人），未对上 " + s.unmatched + " 户。高楼层在上。";
  const slots = [...new Set(building.units.map(u => slotOf(u.r)))].sort();
  const floors = [...new Set(building.units.map(u => floorOf(u.r)))].sort((a, b) => b - a);
  const by = new Map(building.units.map(u => [floorOf(u.r) + "-" + slotOf(u.r), u]));
  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = "28px " + slots.map(() => "minmax(72px,1fr)").join(" ");
  let html = "<span></span>" + slots.map(sl => "<span class='slot'>" + sl + "室</span>").join("");
  floors.forEach(floor => {
    html += "<span class='fl'>" + floor + "F</span>";
    slots.forEach(sl => {
      const u = by.get(floor + "-" + sl);
      if (!u) { html += "<span></span>"; return; }
      const muted = (filter === "gap" && !(isHome(u) && !matched(u))) || (filter === "open" && u.s !== "可售");
      const id = building.no + "-" + u.r;
      const on = picked === id ? " on" : "";
      const extra = matched(u) ? " · " + u.n.length : "";
      html += "<button class='" + klass(u, muted) + on + "' data-u='" + id + "'>" + cellLabel(building.no, u) + extra + "</button>";
    });
  });
  grid.innerHTML = html;
  const selected = building.units.find(u => building.no + "-" + u.r === picked);
  const detail = document.getElementById("detail");
  if (selected) {
    const sale = SOLD.has(selected.s) ? "已售（" + selected.s + "）" : selected.s === "可售" ? "未售" : "未纳入网上销售";
    const who = matched(selected) ? "门牌已对上 " + selected.n.length + " 人：" + selected.n.join("、") : (isHome(selected) ? "未入群，或在群里但没有写对这个门牌" : "");
    detail.innerHTML = "<strong>" + building.no + "号楼 " + selected.r + (selected.label ? "（" + selected.label + "）" : "") + "</strong><p>" + sale + (who ? " · " + who : "") + "</p>";
  } else {
    detail.innerHTML = "<p>点一户可看销售状态和对上的人。格子上的数字是把这个门牌写进群备注的人数。</p>";
  }
  const rows = DATA.buildings.map(b => {
    const x = summarize(b);
    return "<tr><td><button class='link' data-b='" + b.no + "'>" + b.no + "号楼</button></td><td>" + x.homes + "</td><td>" + x.sold + "</td><td>" + x.open + "</td><td>" + x.grouped + "</td><td>" + x.unmatched + "</td></tr>";
  }).join("");
  document.getElementById("table").innerHTML = "<thead><tr><th>号楼</th><th>住宅</th><th>已售</th><th>未售</th><th>门牌已对上</th><th>未对上</th></tr></thead><tbody>" + rows + "</tbody>";
  document.getElementById("foot").textContent = "已入群 " + GROUP + " 人里，" + totals.people + " 人的群备注对上了真实住宅，另外 " + (GROUP - totals.people) + " 人在群里但备注对不上。510 套里对上 " + totals.grouped + " 户，还剩 " + totals.unmatched + " 户。";
}
document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-b]");
  const f = e.target.closest("[data-f]");
  const u = e.target.closest("[data-u]");
  if (b) { current = b.dataset.b; picked = null; render(); document.getElementById("title").scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (f) { filter = f.dataset.f; render(); }
  else if (u) { picked = picked === u.dataset.u ? null : u.dataset.u; render(); }
});
render();
</script>
</body>
</html>
